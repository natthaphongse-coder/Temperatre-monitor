
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Temperature Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Room Temperature Monitor</h1>
  <p class="subtitle">รายงานอุณหภูมิห้องโรงงานชลบุรี CHB_2 </p>

  <div class="temperature-card">
    <h2>Cold Room</h2>
    <p id="cold">-20.0 °C</p>
  </div>

  <div class="temperature-card">
    <h2>Loading Room</h2>
    <p id="loading">4.0 °C</p>
  </div>

  <div class="temperature-card">
    <h2>Ante Room</h2>
    <p id="ante">4.5 °C</p>
  </div>

  <div class="temperature-card">
    <h2>Checkpoint</h2>
    <p id="checkpoint">3.5 °C</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
